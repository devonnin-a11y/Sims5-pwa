<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sims 5 PWA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/core.css" />
  <link rel="stylesheet" href="css/hud.css" />
  <link rel="stylesheet" href="css/cas.css" />
</head>

<body>
  <div id="cas">
    <h2>Create-A-Sim</h2>

    <input id="cas-name" placeholder="Sim Name" />

    <select id="cas-age">
      <option>Child</option>
      <option>Teen</option>
      <option selected>Young Adult</option>
      <option>Adult</option>
      <option>Elder</option>
    </select>

    <select id="cas-trait">
      <option>Creative</option>
      <option>Active</option>
      <option>Family-Oriented</option>
      <option>Lazy</option>
      <option>Genius</option>
    </select>

    <button onclick="submitCAS()">Start Life</button>
    <button id="cas-start-btn" onclick="submitCAS()">Start Life</button>

  </div>

  <div id="game">
    <div id="sim-avatar">🧍</div>

    <div id="hud">
      <div id="time"></div>

      <button onclick="setSpeed(0)">⏸️</button>
      <button onclick="setSpeed(1)">▶️</button>
      <button onclick="setSpeed(2)">⏩</button>
      <button onclick="setSpeed(3)">⏭️</button>

      <div class="need" id="hunger">🍽️ <span></span></div>
      <div class="need" id="energy">⚡ <span></span></div>
      <div class="need" id="social">💬 <span></span></div>
      <div id="emotion">🙂</div>
    </div>
  </div>

  <!-- Main app -->
  <script type="module" src="js/app.js"></script>

  <!-- Expose module functions to HTML onclick handlers -->
  <script type="module">
    import { submitCAS } from "./js/cas.js";
    import { setSpeed } from "./js/time.js";

    window.submitCAS = submitCAS;
    window.setSpeed = setSpeed;

    // Service worker registration (keep inside the document)
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("SW registered"))
        .catch(err => console.error("SW failed", err));
    }
  </script>
</body>
</html>
